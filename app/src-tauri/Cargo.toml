[package]
name = "kioku"
version = "0.1.0"
description = "Search your Photos library by what's in it."
authors = ["Samanvya Tripathi"]
edition = "2024"

[lib]
name = "kioku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
